[opener]
edit = [{ run = 'kitty vim %s', orphan = true, desc = "vim" }]
rename = [{ run = 'kitty vim %s', block = true, desc = "rename" }]
zed = [{ run = 'zeditor %s', orphan = true }]
vector = [{ run = 'inkscape %s', orphan = true }]
raster = [{ run = 'krita %s', orphan = true }]
snip = [{ run = 'satty -f %s', orphan = true }]
browser = [{ run = 'vivaldi %s', orphan = true }]
viewer = [{ run = 'evince %s', orphan = true }]
play = [{ run = 'mpv %s', orphan = true, for = "unix" }]
open = [{ run = 'xdg-open %s', desc = "Open" }]
zed_dir = [{ run = 'zeditor %s', orphan = true, desc = "Open directory with Zed" }]
bitwig = [{ run = 'bitwig-studio %s', orphan = true }]
aff = [{ run = 'WINEPREFIX="$HOME/Applications/affinity-suite" "$HOME/.local/share/lutris/runners/wine/ElementalWarriorWine-x86_64/bin/wine" start /unix %s', orphan = true, desc = "Affinity" }]
extract = [{ run = '7z x %s1 -o%d1', block = true, desc = "Extract archive" }]
office = [{ run = 'libreoffice %s', orphan = true, desc = "LibreOffice" }]

[open]
prepend_rules = [
    { mime = "text/plain", use = [
        "edit",
    ] },
    { mime = "inode/directory", use = [
        "zed_dir",
        "open",
    ] },
    { mime = "video/*", use = [
        "play",
    ] },
    { url = "*.svg", use = [
        "vector",
        "edit",
    ] },
    { mime = "image/*", use = [
        "raster",
        "snip",
    ] },
    { url = "*.pdf", use = [
        "viewer",
        "browser",
        "vector",
    ] },
    { url = "*.html", use = [
        "browser",
    ] },
    { url = "*.bwproject", use = [
        "bitwig",
    ] },
    { url = "*.doc", use = ["office"] },
    { url = "*.docx", use = ["office"] },
    { url = "*.xls", use = ["office"] },
    { url = "*.xlsx", use = ["office"] },
    { url = "*.ppt", use = ["office"] },
    { url = "*.pptx", use = ["office"] },
    { url = "*.odt", use = ["office"] },
    { url = "*.ods", use = ["office"] },
    { url = "*.odp", use = ["office"] },
    { url = "*.rtf", use = ["office"] },
    { url = "*.af", use = [
        "aff",
    ] },
    { mime = "audio/*", use = ["play"] },
    { mime = "application/zip", use = ["extract"] },
    { mime = "application/x-tar", use = ["extract"] },
    { mime = "application/x-bzip2", use = ["extract"] },
    { mime = "application/x-gzip", use = ["extract"] },
    { mime = "application/x-xz", use = ["extract"] },
    { mime = "application/x-7z-compressed", use = ["extract"] },
    { mime = "application/x-rar", use = ["extract"] },
    { url = "*", use = [
        "rename",
        "zed",
    ] },
]

[mgr]
linemode = "size_and_mtime"
