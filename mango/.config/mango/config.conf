# More option see https://github.com/DreamMaoMao/mango/wiki/

exec_once=~/.config/mango/autostart.sh

# Monitors
monitor_rule=name:HDMI-A-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
monitor_rule=name:eDP-1,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1.3

# Window effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=1
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.9

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 0-horizontal,1-vertical
animations=1
layer_animations=1
# open/close: fade = opacity only (no movement). Types: zoom, slide, fade, none
animation_type_open=fade
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.94
zoom_end_ratio=0.8
fade_in_begin_opacity=0.0
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=700
animation_duration_tag=350
animation_duration_close=300
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_in=0.4,0,0.2,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=1
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.3,0.5,0.7,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
smart_gaps=0

# Monocle Tab Bar (defaults: height 33, font monospace Bold 13, border 4)
tab_bar_height=22
tab_bar_decorate_font_desc=Hack Nerd Font Bold 10
tab_bar_decorate_border_width=0
# Both tabs share one background, darker than the terminal (#242835) for contrast;
# only the active title uses theme primary (#ff9e64)
tab_bar_decorate_bg_color=0x16181fbf
tab_bar_decorate_focus_bg_color=0x16181fbf
tab_bar_decorate_fg_color=0x929292ff
tab_bar_decorate_focus_fg_color=0xff9e64ff

# Overview Setting
hotarea_size=10
enable_hotarea=1
# ov_tab_mode (no 0.18 equivalent found) ov_tab_mode=0
overview_gap_inner=20
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
# inhibit_regardless_of_visibility=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=1

# Turn off silly defaults
new_is_master=0
enable_hotarea=0
warp_cursor=1
sloppy_focus=1
axis_bind_apply_timeout=100
drag_tile_to_tile=1
enable_floating_snap=0
snap_distance=30

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=1
root_color=0x201b14ff
border_color=0x00000000
focus_color=0xFFBD93F9
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# reload config

# sub config load
# source=~/.config/mango/env.conf
source=~/.config/mango/bind.conf
source=~/.config/mango/rule.conf

# DMS Include Configs
source=./dms/layout.conf
