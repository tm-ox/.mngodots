onboarding = false

[keys]
next_tab = ["prefix+n", "ctrl+right"]
previous_tab = ["prefix+p", "ctrl+left"]
new_tab = ["prefix+c", "ctrl+t"]
goto = ["prefix+g", "ctrl+s"]
resize_pane_left = "ctrl+alt+h"
resize_pane_down = "ctrl+alt+j"
resize_pane_up = "ctrl+alt+k"
resize_pane_right = "ctrl+alt+l"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

[theme]
name = "tokyo-night"
auto_switch = false

[session]
resume_agents_on_restore = true

[ui]
sidebar_min_width = 14
sidebar_max_width = 24
pane_gaps = false
hide_tab_bar_when_single_tab = true

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = true
path = "/home/tm/.mngodots/herdr/.config/herdr/sounds/notification.mp3"
done_path = "/home/tm/.mngodots/herdr/.config/herdr/sounds/done.mp3"
request_path = "/home/tm/.mngodots/herdr/.config/herdr/sounds/request.mp3"

[experimental]
kitty_graphics = true
pane_history = true
